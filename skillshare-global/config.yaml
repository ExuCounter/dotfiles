# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  skills: /Users/volodymyrpotiichuk/Desktop/projects/dotfiles/claude/skills
  agents: /Users/volodymyrpotiichuk/Desktop/projects/dotfiles/claude/agents
mode: merge
targets:
  claude:
    skills:
      path: /Users/volodymyrpotiichuk/.claude/skills
ignore:
  - .DS_Store
  - .git/
  - __pycache__/
audit:
  block_threshold: CRITICAL
mcp:
  servers:
    GitLab:
      url: https://gitlab.com/api/v4/mcp
      targets:
        - claude
    atlassian:
      transport: streamable-http
      url: https://mcp.atlassian.com/v1/mcp
      targets:
        - claude
    dbhub:
      url: https://dbhub.example.com/mcp
      targets:
        - claude
    notion:
      url: https://mcp.notion.com/mcp
      targets:
        - claude
    tidewave:
      url: http://localhost:4000/tidewave/mcp
      targets:
        - claude
plugins:
  version: 2
  packages:
    agent-skills:
      bindings:
        claude:
          imported: true
    datadog:
      bindings:
        claude:
          imported: true
    revdiff:
      bindings:
        claude:
          imported: true
    typescript-lsp:
      bindings:
        claude:
          imported: true
