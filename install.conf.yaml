- defaults:
    link:
      relink: true
      create: true

- clean: ["~", "~/.claude/hooks", "~/.claude/skills", "~/.claude/rules", "~/.claude/agents"]

- link:
    # configuration
    ~/.zshrc: zshrc
    ~/.gitconfig: .gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.tool-versions: .tool-versions
    ~/.zsh_history: .zsh_history
    ~/.tmux.conf:
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/rules/comments-and-docs.md: claude/rules/comments-and-docs.md
    ~/.claude/rules/tdd.md: claude/rules/tdd.md
    ~/.claude/rules/frontend-preview.md: claude/rules/frontend-preview.md
    ~/.claude/rules/browser-automation.md: claude/rules/browser-automation.md
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    ~/.claude/hooks/markdown-review.sh: claude/hooks/markdown-review.sh
    ~/.claude/hooks/hunk-review.sh: claude/hooks/hunk-review.sh
    ~/.claude/hooks/main-session-notify.sh: claude/hooks/main-session-notify.sh
    ~/.claude/skills/open-workspace/SKILL.md: claude/skills/open-workspace/SKILL.md
    ~/.claude/skills/grilling/SKILL.md: claude/skills/grilling/SKILL.md
    ~/.claude/skills/grill-me/SKILL.md: claude/skills/grill-me/SKILL.md
    # force: this target was a real directory holding a linked SKILL.md until the
    # skill grew a references/ folder. dotbot's relink replaces a symlink but not a
    # directory, so without force ./install fails here on every machine that ran an
    # older revision. force makes that first run rm -rf the directory, so anything
    # kept by hand under ~/.claude/skills/frontend-preview/ is deleted with it.
    ~/.claude/skills/frontend-preview:
      path: claude/skills/frontend-preview
      force: true
    ~/.claude/skills/render-component: claude/skills/render-component
    ~/.claude/skills/wayfinder: claude/skills/wayfinder
    ~/.claude/skills/codebase-design: claude/skills/codebase-design
    ~/.claude/skills/domain-modeling: claude/skills/domain-modeling
    ~/.claude/skills/writing-for-agents: claude/skills/writing-for-agents
    ~/.claude/skills/c4-architecture: claude/skills/c4-architecture
    ~/.claude/skills/command-creator: claude/skills/command-creator
    ~/.claude/skills/domain-name-brainstormer: claude/skills/domain-name-brainstormer
    ~/.claude/skills/handoff: claude/skills/handoff
    ~/.claude/skills/lesson-learned: claude/skills/lesson-learned
    ~/.claude/skills/research: claude/skills/research
    ~/.claude/skills/tdd: claude/skills/tdd
    ~/.claude/skills/to-spec: claude/skills/to-spec
    # wio: vendored from the workersio/skills plugin (v0.1.0, MIT) rather than
    # installed as a plugin. The plugin ships a PostToolUse hook that fires on
    # every edit whose path looks like a test, and a plugin's hooks cannot be
    # disabled on their own — `claude plugin disable` takes the whole plugin.
    # The copy drops scripts/test-review-reminder.py, which was only ever the
    # hook's helper. Updating means re-copying from upstream by hand.
    ~/.claude/skills/wio: claude/skills/wio
    ~/.claude/agents/wio-candidate-scout.md: claude/agents/wio-candidate-scout.md
    ~/.claude/agents/wio-strategy-critic.md: claude/agents/wio-strategy-critic.md
    ~/.claude/agents/wio-test-reviewer.md: claude/agents/wio-test-reviewer.md
    ~/.config/glow/solarized-light.json: glow/solarized-light.json
    ~/Library/Preferences/glow/glow.yml: glow/glow.yml
    ~/.config/kitty/theme.conf: theme.conf
    ~/.config/herdr/config.toml: herdr.toml
    # hunk loads a symlinked file from here, never a symlinked folder.
    ~/.config/hunk/extensions/hunk-send.ts: hunk/hunk-send.ts
    # zsh
    ~/.config/zsh/:
      glob: true
      force: true
      path: zsh/*
    # scripts
    ~/.config/sh/:
      glob: true
      force: true
      path: sh/*
    # bin
    ~/.config/bin/:
      glob: true
      force: true
      path: bin/*
    # tmux windows management
    ~/.teamocil/:
      glob: true
      force: true
      path: teamocil/*
    # fzf tmux sessions plugin
    ~/.config/fzf_tmux_sessions/:
      glob: true
      force: true
      path: fzf_tmux_sessions/*
    # herdr layout scripts (teamocil replacement)
    ~/.config/herdr_layouts/:
      glob: true
      force: true
      path: herdr_layouts/*
    # fzf herdr workspace switcher (bound to prefix+f)
    ~/.config/fzf_herdr_workspaces/:
      glob: true
      force: true
      path: fzf_herdr_workspaces/*
    # nvim
    ~/.config/nvim/:
      glob: true
      force: true
      path: nvim/**
      exclude: [nvim/lua/init.lua]
    ~/.config/nvim/init.lua: nvim/lua/init.lua
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: |
        mkdir -p "$HOME/RaycastScripts"
        find "$HOME/.config/bin" -maxdepth 1 -type f -name '*.sh' -exec grep -l '@raycast.schemaVersion' {} \; |
          while IFS= read -r f; do
            ln -sfn "$f" "$HOME/RaycastScripts/$(basename "$f")"
          done
      description: Symlink Raycast-tagged scripts from ~/.config/bin into ~/RaycastScripts (visible folder)
    - command: |
        if command -v herdr >/dev/null 2>&1; then
          mkdir -p "$HOME/.claude/skills/use-herdr"
          herdr --skill > "$HOME/.claude/skills/use-herdr/SKILL.md"
        fi
      description: Refresh the use-herdr skill from the installed herdr binary
    - command: |
        # An extension runs with full user permissions; move the pin only to a
        # commit whose code has been read.
        pin=6bd96646070a3f6c5ad096611b8af05156a59204
        installed_commit() {
          git --git-dir="${XDG_CONFIG_HOME:-$HOME/.config}/hunk/extensions/installed/hunk-viewed/.git" \
            rev-parse -q --verify HEAD 2>/dev/null
        }
        if ! command -v hunk >/dev/null 2>&1; then
          echo "hunk is not installed, so hunk-viewed is skipped: brew install hunk"
        elif [ "$(installed_commit)" != "$pin" ]; then
          hunk extension remove hunk-viewed >/dev/null 2>&1
          if ! hunk extension install "jacegodk/hunk-viewed@$pin" --yes; then
            echo "hunk-viewed needs hunk 0.21 or newer: brew upgrade hunk"
          elif [ "$(installed_commit)" != "$pin" ]; then
            hunk extension remove hunk-viewed
            echo "hunk-viewed: the clone is not commit $pin, so it was removed"
          fi
        fi
      description: Install the hunk-viewed extension (V marks a file viewed in hunk reviews)
    - command: |
        # A plugin runs with full user permissions; move the pin only to a commit
        # whose code has been read. Its build step downloads two release binaries,
        # and a release's files can be replaced, so their digests are pinned too.
        pin=cbba4732229191347ff5128e3da71f64474a6a49
        sums="a9da49dd6a44d3494fed0e8366ca32996ecdf40e0271fced410cec3c8839175d  bin/plannotator-tui.exe
        5a9c53d377cd87e64de01b9e43c8490453f6ab81a11311d340a4bff070ea4308  bin/herdr-annotate.exe"
        if ! command -v herdr >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
          echo "herdr or jq is not installed, so the Annotate plugin is skipped"
        elif ! plugins="$(herdr plugin list 2>/dev/null)"; then
          echo "herdr is not running, so the Annotate plugin is skipped"
        else
          if ! printf '%s\n' "$plugins" | grep -qF "github:plannotator/herdr-annotate@$pin"; then
            herdr plugin install plannotator/herdr-annotate --ref "$pin" --yes
          fi
          root="$(jq -r '.[]? | select(.plugin_id == "annotate") | .plugin_root // empty' \
            "${XDG_CONFIG_HOME:-$HOME/.config}/herdr/plugins.json" 2>/dev/null)"
          if [ -n "$root" ] && ! (cd "$root" && printf '%s\n' "$sums" | sed 's/^ *//' | shasum -a 256 -c --status); then
            herdr plugin uninstall annotate
            echo "Annotate: its binaries do not match the pinned digests, so it was uninstalled"
          fi
        fi
      description: Install the herdr Annotate plugin (Markdown review in plannotator-tui)
    - command: |
        python3 - <<'EOF'
        import json, pathlib
        # Plugin updates ship chrome-devtools-mcp without --isolated, so every
        # agent session reaches for the one shared Chrome profile and the second
        # one fails. Claude Code reads the commit-sha copy, not the version-named
        # one, so patch every copy. Takes effect on the next session start.
        root = pathlib.Path.home() / ".claude/plugins/cache"
        for f in root.glob("*/chrome-devtools-mcp/*/mcp.json"):
            c = json.loads(f.read_text())
            for srv in c.get("mcpServers", {}).values():
                a = srv.get("args", [])
                if "--isolated" not in a:
                    a.append("--isolated")
                    f.write_text(json.dumps(c, indent=2) + "\n")
                    print("patched", f)
        EOF
      description: Keep --isolated on the chrome-devtools MCP server (plugin updates drop it)
