- defaults:
    link:
      relink: true
      create: true

- clean: ["~", "~/.config/kitty", "~/.claude/hooks", "~/.claude/skills", "~/.claude/rules", "~/.claude/agents"]

- link:
    # configuration
    ~/.zshrc: zshrc
    ~/.gitconfig: .gitconfig
    ~/.gitignore_global: gitignore_global
    ~/.tool-versions: .tool-versions
    ~/.zsh_history: .zsh_history
    ~/.tmux.conf:
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/rules/comments-and-docs.md: claude/rules/comments-and-docs.md
    ~/.claude/rules/tdd.md: claude/rules/tdd.md
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    # Claude Code hooks, each linked by name: herdr's own integration keeps its
    # herdr-agent-state.sh in the same folder, and dotbot refuses a glob that
    # matches a single path.
    ~/.claude/hooks/herdr-status.sh: claude/hooks/herdr-status.sh
    ~/.config/glow/solarized-light.json: glow/solarized-light.json
    ~/Library/Preferences/glow/glow.yml: glow/glow.yml
    ~/.config/kitty/theme.conf: theme.conf
    ~/.config/skillshare/config.yaml: skillshare-global/config.yaml
    ~/.config/herdr/config.toml: herdr.toml
    ~/.config/herdr-automatic-rename/config.sh: herdr_plugins/herdr-automatic-rename/config.sh
    # zsh
    ~/.config/zsh/:
      glob: true
      force: true
      path: zsh/*
    # scripts
    ~/.config/sh/:
      glob: true
      force: true
      path: sh/*
    # bin
    ~/.config/bin/:
      glob: true
      force: true
      path: bin/*
    # tmux windows management
    ~/.teamocil/:
      glob: true
      force: true
      path: teamocil/*
    # fzf tmux sessions plugin
    ~/.config/fzf_tmux_sessions/:
      glob: true
      force: true
      path: fzf_tmux_sessions/*
    # herdr layout scripts (teamocil replacement)
    ~/.config/herdr_layouts/:
      glob: true
      force: true
      path: herdr_layouts/*
    # Herdr app mods, linked by folder: a mod's own module (./smart.mjs)
    # linked by file resolves outside the mod's folder and fails to load.
    ~/.config/herdr-app/mods/better-sidebar: herdr-app/mods/better-sidebar
    # fzf herdr workspace switcher (bound to prefix+f). Each picker is one
    # file, linked by name: dotbot refuses a glob that matches a single path.
    ~/.config/fzf_herdr_workspaces/bin/fzf_herdr_workspaces.sh: fzf_herdr_workspaces/bin/fzf_herdr_workspaces.sh
    # Whiska project picker (bound to prefix+space)
    ~/.config/fzf_whiska/bin/whiska_picker.sh: fzf_whiska/bin/whiska_picker.sh
    # nvim
    ~/.config/nvim/:
      glob: true
      force: true
      path: nvim/**
      exclude: [nvim/lua/init.lua]
    ~/.config/nvim/init.lua: nvim/lua/init.lua
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: |
        mkdir -p "$HOME/RaycastScripts"
        find "$HOME/.config/bin" -maxdepth 1 -type f -name '*.sh' -exec grep -l '@raycast.schemaVersion' {} \; |
          while IFS= read -r f; do
            ln -sfn "$f" "$HOME/RaycastScripts/$(basename "$f")"
          done
      description: Symlink Raycast-tagged scripts from ~/.config/bin into ~/RaycastScripts (visible folder)
    - command: |
        if command -v skillshare >/dev/null 2>&1; then
          skillshare sync
        fi
      description: Link the skills in claude/skills into each agent through skillshare
