onboarding = false
[theme]
name = "solarized"
auto_switch = true

[keys]
prefix = "ctrl+a"

split_vertical = "prefix+v"
split_horizontal = "prefix+s"

reload_config = "prefix+shift+i"
close_pane = "prefix+x"
close_workspace = "prefix+shift+x"

last_pane = "prefix+0"
workspace_picker = "prefix+w"

previous_tab = "prefix+h"
next_tab = "prefix+l"

previous_agent = "prefix+k"
next_agent = "prefix+j"
focus_agent = "prefix+ctrl+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "K"
navigate_pane_down = "J"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/fzf_herdr_workspaces/bin/fzf_herdr_workspaces.sh"
width = "75%"
height = "50%"

# Smart pane navigation: focus neighbor pane, or spill to prev/next workspace at edge.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr_layouts/smart_pane_nav.sh left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr_layouts/smart_pane_nav.sh down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr_layouts/smart_pane_nav.sh up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr_layouts/smart_pane_nav.sh right"

# Annotate plugin (plannotator/herdr-annotate): comment on selected terminal text.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Annotate plugin: review a document or the agent's reply in plannotator-tui.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

[ui]
tab_bar_right = [
  { type = "command", command = "/Users/volodymyrpotiichuk/.whiska/herdr-status.sh '⌃a space'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "n=$(herdr agent list | jq -r '[.result.agents[] | select(.agent_status==\"blocked\")] | length'); [ \"$n\" -gt 0 ] && printf '🔴 %s agents waiting' \"$n\"", interval_seconds = 2 },
  { type = "command", command = "top -l 1 -n 0 | awk '/CPU usage/ {printf \"CPU %.0f%%\", $3+$5}'", interval_seconds = 5 },
  { type = "command", command = "pmset -g batt | awk '/InternalBattery/ {for (i=1;i<=NF;i++) if ($i ~ /%/) {gsub(\";\",\"\",$i); print \"Bat \"$i; exit}}'", interval_seconds = 30 },
  { type = "datetime", format = "%d/%m/%y %a %H:%M:%S" },
]
tab_bar_right_separator = " | "
prompt_new_tab_name = false

# Herdr's toasts and sounds fire for any background workspace and cannot be
# filtered per workspace — every worktree session is an agent of kind `claude`
# just like the main one, so [ui.sound.agents] can't separate them either. Both
# are off here; a worktree's question arrives through Whiska.
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = false

# Whiska's line under a mouse's workspace: what it needs from you, if anything.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#586e75", dim = false }],
  ["branch", "git_status"],
  [{ token = "$whiska", fg = "#657b83", dim = false, rules = [
    { starts_with = "🐭", fg = "#cb4b16" },
    { starts_with = "⚠", fg = "#dc322f" },
    { starts_with = "✖", fg = "#dc322f" },
    { starts_with = "?", fg = "#dc322f" },
    { starts_with = "✅", fg = "#859900" },
    { starts_with = "⏳", fg = "#b58900" },
    { starts_with = "🎯", fg = "#6c71c4" },
    { starts_with = "💤", fg = "#6c71c4" },
    { starts_with = "⏸", fg = "#6c71c4" },
    { starts_with = "↩", fg = "#268bd2" },
    { starts_with = "◐", fg = "#268bd2" },
    { starts_with = "◓", fg = "#268bd2" },
    { starts_with = "◑", fg = "#268bd2" },
    { starts_with = "◒", fg = "#268bd2" },
  ] }],
  [{ token = "$whiska_q", fg = "#93a1a1" }],
  [{ token = "$whiska_q2", fg = "#93a1a1" }],
]

# Whiska: every project's main session in fzf, waiting ones first; enter jumps.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "~/.config/fzf_whiska/bin/whiska_picker.sh"
width = "80%"
height = "60%"
