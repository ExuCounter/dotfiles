# vim:fileencoding=utf-8:foldmethod=marker

font_family JetBrainsMono Nerd Font Medium
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 14
modify_font cell_height 11px

cursor_text_color background
cursor_blink_interval 0

# Cmd+click opens a link even when a mouse-grabbing app (herdr) is running.
# Without "grabbed" kitty hands the click to herdr; "press ... discard_event"
# keeps herdr from also seeing it.
mouse_map cmd+left press grabbed discard_event
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link

include ./theme.conf
