# Cmd+click on a link to a Markdown file opens it in the Plannotator review tab
# (see open-markdown-link.sh) instead of the editor kitty would pick. Every
# other link keeps kitty's default: web links open in the browser.
protocol file
ext md,markdown
action launch --type=background ~/.config/kitty/open-markdown-link.sh ${FILE_PATH}

# Cmd+click on a `hunk-review://<base>..<branch>` link opens that branch's diff
# in a hunk tab of the main workspace (see open-hunk-review.sh).
protocol hunk-review
action launch --type=background ~/.config/kitty/open-hunk-review.sh ${URL}
