# Cmd+click on a link to a Markdown file or a git patch opens it for review in
# revdiff (see open-review-link.sh) instead of the app kitty would pick. Every
# other link keeps kitty's default: web links open in the browser.
protocol file
ext md,markdown
action launch --type=background ~/.config/kitty/open-review-link.sh ${FILE_PATH}

protocol file
ext diff,patch
action launch --type=background ~/.config/kitty/open-review-link.sh ${FILE_PATH}
